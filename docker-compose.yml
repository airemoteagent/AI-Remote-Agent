# remote-agent — compose deployment
# Read-only rootfs, tmpfs /tmp, persistent volume for agent state.
# Health/metrics stay bound to localhost inside the container and are
# optionally published to the host loopback only.
services:
  remote-agent:
    build: .
    image: remote-agent:local
    read_only: true
    tmpfs:
      - /tmp
    environment:
      REMOTE_CLOUD: ${REMOTE_CLOUD:-https://remoteagent.online}
      REMOTE_METRICS_PORT: "4301"
    volumes:
      - remote-agent-data:/home/agent/.remote-agent
    ports:
      - "127.0.0.1:4301:4301"   # healthz/metrics on host loopback only
    restart: unless-stopped

volumes:
  remote-agent-data:
